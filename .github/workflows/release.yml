# Builds SlimCode Desktop and publishes a GitHub release.
#
# Manual only: start it from the Actions tab ("Run workflow") or with
#   gh workflow run release.yml [-f draft=false] [-f prerelease=true]
#
# Work happens on dev; main only ever points at the latest release. A run
# releases the current tip of dev: it is built and tested, and only when all
# of that passes is main fast-forwarded to it and the release tagged on it.
# main never gets a merge commit and never moves to an untested commit. If
# main has commits that dev lacks (a direct fix on main), the run fails --
# merge main into dev by hand once, then rerun.
#
# The version is taken from <Version> in dev's SlimCodeDesktop.csproj and
# becomes the tag v{version}. Bump it, commit, push dev, then run this
# workflow (from dev or main). A run whose tag or release already exists fails
# before anything is built.
#
# Jobs:
#   prepare      -- ref guard, dev/main ancestry check, version, duplicate check
#   build        -- Windows runner: publish.bat (Windows tests + all archives)
#   test-linux   -- Ubuntu runner: the Linux unit tests a Windows host can't run
#   release      -- Ubuntu runner: exec bit, checksums, fast-forward main, release
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft (publish it by hand on GitHub)
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

# Never run two releases at once; a second run waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_VERSION: "10.0.x"

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Write access only so the release listing below includes drafts.
    permissions:
      contents: write
    outputs:
      sha:     ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The selected ref only decides which copy of this workflow runs; what
      # gets released is always the tip of dev.
      - name: Require dev or main
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start the release from dev or main (selected: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve dev and check main can fast-forward
        id: source
        run: |
          if ! git rev-parse --verify --quiet origin/dev > /dev/null; then
            echo "::error::Branch dev does not exist on origin."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "::error::main has commits that dev does not -- merge main into dev, push, and rerun."
            git log --oneline origin/dev..origin/main
            exit 1
          fi
          sha="$(git rev-parse origin/dev)"
          echo "Releasing dev @ $sha ($(git rev-list --count origin/main..origin/dev) commit(s) ahead of main)"
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content -LiteralPath SlimCodeDesktop.csproj
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not find a <Version> element in SlimCodeDesktop.csproj"
          }
          $version = $version.Trim()
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Drafts have no git tag yet, so check the release list as well as tags.
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists -- bump <Version> in SlimCodeDesktop.csproj."
            exit 1
          fi
          releases="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$TAG" <<< "$releases"; then
            echo "::error::A release (possibly a draft) for $TAG already exists -- bump <Version> or delete it."
            exit 1
          fi

  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # nuget.config keeps the package cache project-local in packages\.
      - uses: actions/cache@v6
        with:
          path: packages
          key: nuget-windows-${{ hashFiles('SlimCodeDesktop.csproj', 'Tests/**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-windows-

      - name: Publish (tests + archives)
        shell: cmd
        run: publish.bat

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v6
        with:
          path: packages
          key: nuget-linux-${{ hashFiles('SlimCodeDesktop.csproj', 'Tests/**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-linux-

      - name: Unit tests (TargetOS=Linux)
        run: dotnet test Tests/SlimCodeDesktop.Tests/SlimCodeDesktop.Tests.csproj -c Release -p:TargetOS=Linux

  release:
    needs: [prepare, build, test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA:     ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The tarball was written on Windows, which has no exec bit to record.
      # Repack it with the bit set on the executables; the binaries are unchanged.
      - name: Restore exec bit in the Linux archive
        run: |
          archive="dist/slimcode_desktop_v${VERSION}_linux-x64.tar.gz"
          test -f "$archive" || { echo "::error::Missing $archive"; exit 1; }
          stage="$(mktemp -d)"
          tar -xzf "$archive" -C "$stage"
          test -f "$stage/SlimCodeDesktop" || { echo "::error::SlimCodeDesktop not found in $archive"; exit 1; }
          chmod +x "$stage/SlimCodeDesktop"
          if [ -f "$stage/createdump" ]; then chmod +x "$stage/createdump"; fi
          tar -czf "$archive" --owner=0 --group=0 --numeric-owner -C "$stage" .
          tar -tvzf "$archive" | grep -E ' \./(SlimCodeDesktop|createdump)$'

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum slimcode_desktop_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Only now, with build and tests green, does main move. force=false makes
      # GitHub reject anything but a fast-forward, so a main that changed
      # during the run stops the release instead of being overwritten.
      #
      # GITHUB_TOKEN may not move a branch across changes to .github/workflows/.
      # For releases that include such changes, add a fine-grained PAT as the
      # secret RELEASE_PUSH_TOKEN (this repo only; Contents + Workflows: read
      # and write). Without it, such a run stops here, before any release exists.
      - name: Fast-forward main to the released commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: |
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
                 -f sha="$SHA" -F force=false --jq '"main -> " + .object.sha'; then
            echo "::error::Could not fast-forward main to $SHA. Either main moved during the run, or the release changes .github/workflows/ and needs the RELEASE_PUSH_TOKEN secret (see the comment in release.yml)."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" dist/* \
            --target "$SHA" \
            --title "SlimCode Desktop v${VERSION}" \
            --generate-notes \
            "${flags[@]}"
