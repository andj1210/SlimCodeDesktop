<?xml version="1.0" encoding="UTF-8"?>
<!-- SlimCode Desktop app icon: </> robot agent, black shades, fedora tilted 4 deg.
     Source of truth for every raster size >= 32 px. Smaller sizes use slimcode-small.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#1E1E1F"/>

  <!-- head: visor -->
  <rect x="34" y="27" width="32" height="18" rx="9" fill="#2E2E30" stroke="#CCCCCC" stroke-width="5"/>

  <!-- black sunglasses -->
  <rect x="38" y="31" width="11" height="8.5" rx="3.5" fill="#0A0A0A"/>
  <rect x="51" y="31" width="11" height="8.5" rx="3.5" fill="#0A0A0A"/>
  <path d="M49 34 H51" fill="none" stroke="#CCCCCC" stroke-width="2"/>
  <path d="M40.5 37.5 L43.5 34 M53.5 37.5 L56.5 34" fill="none" stroke="#E8F4FC" stroke-width="1.6" stroke-linecap="round"/>

  <!-- body: </> -->
  <path d="M38 53 L23 68 L38 83 M62 53 L77 68 L62 83" fill="none" stroke="#3DA8E5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 51 L45 92" fill="none" stroke="#CCCCCC" stroke-width="8" stroke-linecap="round"/>

  <!-- fedora: full brim (far side visible), crown, accent band -->
  <g transform="rotate(-4 50 26)">
    <ellipse cx="50" cy="26.5" rx="23" ry="4.5" fill="#2E2E30" stroke="#CCCCCC" stroke-width="2.5"/>
    <path d="M37 26 L39 13 Q44.5 10 50 13 Q55.5 10 61 13 L63 26 Q50 29 37 26 Z" fill="#2E2E30" stroke="#CCCCCC" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M38.2 20 Q50 22.5 61.8 20 L62.5 24 Q50 27 37.5 24 Z" fill="#3DA8E5"/>
  </g>
</svg>
